<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#172c2b" />
    <title>Character workshop · irudd-game-tools</title>
    <!-- STYLE -->
  </head>
  <body>
    <header>
      <div class="brand">
        <i aria-hidden="true" class="mark"></i
        ><span>irudd<span class="brand-light"> / game tools</span></span>
      </div>
      <span class="mode">Character workshop</span>
    </header>
    <main>
      <section class="viewer" aria-label="3D character viewport">
        <div id="stage">
          <canvas
            id="viewport"
            tabindex="0"
            aria-label="3D model. Drag to orbit, scroll to zoom, or use the view buttons."
          ></canvas>
        </div>
        <div class="stage-title">
          <span class="overline" id="revision">Current form</span><h1 id="name">Form study</h1><p id="look"></p>
        </div>
        <div class="measure" aria-hidden="true">
          <span id="tick2">2 m</span><span id="tick1">1 m</span
          ><span id="tick0">0 m</span>
        </div>
        <p id="failure" role="alert" hidden></p>
        <div class="camera">
          <div id="angles" aria-label="Camera angle" role="group">
            <button data-angle="3/4" aria-pressed="true">¾</button
            ><button data-angle="Front">Front</button
            ><button data-angle="Side">Side</button
            ><button data-angle="Back">Back</button>
          </div>
          <button id="reset" title="Reset camera angle and zoom">
            Reset view
          </button>
        </div>
        <div class="stage-foot">
          <span>Drag to orbit · Scroll or pinch to zoom</span
          ><span id="size"></span>
        </div>
      </section>
      <aside aria-label="Form controls"><nav class="panel-tabs" aria-label="Workshop tools"><button data-tab="sculpt" aria-pressed="true">Sculpt</button><button data-tab="ai" aria-pressed="false">AI direction</button><button data-tab="files" aria-pressed="false">Forms</button></nav>
<section data-panel="sculpt"><div class="section-title"><h2>Shape nudges</h2><button id="undo" class="quiet" disabled>Undo</button></div>
<label class="field">Apply to<select id="target"></select></label>
<div class="switch" id="operations"><button data-op="shape">Size</button><button data-op="move">Move</button><button data-op="turn">Turn</button><button data-op="face">Face</button></div><div id="features"></div><div class="actions"><button id="direct" aria-pressed="false">Edit on model</button><button id="focus" type="button">Focus selection</button></div>
<div id="knot-tools" hidden><label class="field">Spine point<select id="knot"></select></label><div class="actions"><button id="thinner">Thin point</button><button id="thicker">Thicken point</button><button id="insert-knot">Insert point</button></div></div><p class="micro">Changes are relative to the current form.</p>
<div class="actions"><button class="solid" id="apply">Apply nudge</button><button id="roll">Small reroll</button><button id="clear">Reset</button></div></section>
<section data-panel="ai" class="direction" hidden><h2>AI variation</h2><label class="field" for="steering">Direction</label>
<textarea id="steering" rows="3" maxlength="2000" placeholder="Keep the face. Give it a long, low body and two extra pairs of legs."></textarea>
<p class="micro" id="agent-help"></p><div class="actions"><button id="generate" class="solid"></button><button id="import">Load proposal</button><input id="file" type="file" accept=".json,application/json" hidden></div>
<div id="candidate" hidden><p id="summary"></p><div class="actions"><button id="compare" aria-pressed="false">Show current</button><button id="accept" class="solid">Accept</button><button id="discard">Discard</button></div></div>
</section>
<section data-panel="sculpt"><div class="section-title"><h2>Wardrobe</h2></div><div id="outfits" class="stack" role="group" aria-label="Outfit"></div></section>
<section data-panel="files" hidden><h2>Generate a starting form</h2><label class="field">Anatomy<select id="body-plan"><option value="human">Human</option><option value="creature">Creature</option></select></label><div class="actions"><button id="fresh">Generate new form</button></div></section>
<section data-panel="files" hidden><h2>Form files</h2><div class="actions"><button id="save">Save form</button><button id="open">Open form</button><button id="glb">Export GLB</button></div><input id="openfile" type="file" accept=".json" hidden></section>
<section data-panel="files" hidden><h2>Reference studies</h2><label class="field">Load an editable study<select id="studies"></select></label><button id="study">Load study</button></section>
<section data-panel="sculpt"><details><summary>Build parts</summary><label class="field">Shape<select id="shape"><option>ellipsoid</option><option>box</option><option>cone</option><option>cylinder</option><option>sweep</option></select></label><div class="actions"><button id="attach">Add part</button><button id="duplicate">Duplicate</button><button id="mirror">Mirror</button><button id="remove">Remove</button></div><div id="paintpart"><label class="field">Surface<select id="surface"><option>plain</option><option>canvas</option><option>leather</option><option>metal</option><option>scales</option><option>jacket</option></select></label><label class="field">Color <input id="part-color" type="color"></label></div></details></section>
<section class="display" data-panel="sculpt">
          <h2>Display</h2>
          <div
            class="switch"
            id="display"
            aria-label="Material mode"
            role="group"
          >
            <button data-mode="Color" aria-pressed="true">Studio color</button
            ><button data-mode="Silhouette" aria-pressed="false">
              Silhouette
            </button>
          </div>
        </section>
      <p class="feedback" id="status" role="status"></p></aside>
    </main>
    
    <!-- APP -->
  </body>
</html>
